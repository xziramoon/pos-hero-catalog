<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>slip</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { width: 576px; color: #000; font-family: 'Sarabun', 'Leelawadee UI', 'Leelawadee', 'Tahoma', sans-serif; font-weight: 700; }
  #slip { box-sizing: border-box; width: 576px; padding: 10px 18px 14px; text-align: center; }
  .rule { border-top: 3px dashed #000; margin: 0 0 12px; }
  .title { font-size: 30px; line-height: 1.3; }
  .level { font-size: 26px; line-height: 1.4; margin-bottom: 8px; }
  .zh { font-family: 'Microsoft YaHei', 'SimSun', 'Noto Sans CJK SC', sans-serif; font-size: 28px; line-height: 1.45; }
  .th { font-size: 24px; line-height: 1.4; }
  .block { margin: 6px 0; }
  .meaning { font-size: 22px; line-height: 1.4; text-align: left; margin-top: 8px; }
  .money { font-size: 22px; line-height: 1.4; text-align: left; margin-top: 4px; }
  .footer { font-size: 22px; line-height: 1.4; margin-top: 10px; }
</style>
</head>
<body>
<div id="slip"></div>
<script>
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  // slip = { n, label, zh:[4], th:[4], meaning, money }, opts = { showZh, showTh, footer }
  // คืนความสูง (px) ของใบเซียมซี
  window.renderSlip = function (slip, opts) {
    var lines = function (arr) { return arr.map(function (l) { return '<div>' + esc(l) + '</div>'; }).join(''); };
    var html = '<div class="rule"></div>';
    html += '<div class="title">เซียมซีเจ้าแม่กวนอิม</div>';
    html += '<div class="level">ใบที่ ' + slip.n + ' · ' + esc(slip.label) + '</div>';
    if (opts.showZh) html += '<div class="block zh">' + lines(slip.zh) + '</div>';
    if (opts.showTh) html += '<div class="block th">' + lines(slip.th) + '</div>';
    html += '<div class="meaning">ความหมาย: ' + esc(slip.meaning) + '</div>';
    html += '<div class="money">การเงิน: ' + esc(slip.money) + '</div>';
    if (opts.footer) html += '<div class="footer">' + esc(opts.footer) + '</div>';
    var el = document.getElementById('slip');
    el.innerHTML = html;
    return Math.ceil(el.getBoundingClientRect().height);
  };
</script>
</body>
</html>
