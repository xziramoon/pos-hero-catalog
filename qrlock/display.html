<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8f1020">
<title>จอลูกค้า</title>
<style>
:root{--red:#a0142a;--red2:#6e0a19;--gold:#f3cf6b;--gold2:#c9972b;--ink:#3a0710}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Noto Sans Thai","Sarabun",sans-serif;color:#fff;text-align:center;
 background:radial-gradient(120% 90% at 50% 18%,#c2203a 0%,var(--red) 38%,var(--red2) 100%)}
body::before{content:"";position:fixed;inset:10px;border:2px solid var(--gold2);border-radius:18px;pointer-events:none;opacity:.7}
body::after{content:"";position:fixed;inset:16px;border:1px solid var(--gold);border-radius:14px;pointer-events:none;opacity:.35}
#v{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:28px 22px;gap:1.6vmin}
.shop{font-size:clamp(26px,7.5vmin,64px);font-weight:800;letter-spacing:.02em;color:var(--gold);text-shadow:0 2px 0 #5a0714,0 0 18px rgba(243,207,107,.35)}
.sub{font-size:clamp(14px,3.6vmin,28px);color:#ffe9b0;opacity:.95}
.amt{font-size:clamp(40px,12vmin,110px);font-weight:800;color:var(--gold);text-shadow:0 3px 0 #5a0714;line-height:1.05}
/* มาสคอตริสุซัง — ตัดจากแผ่นต้นแบบด้วย CSS (ไม่ต้องมีไฟล์รูปแยก) */
.mascot{background:url(/assets/risu-sheet.jpg) no-repeat;width:var(--w);aspect-ratio:var(--sw)/var(--sh);
 background-size:calc(1024/var(--sw)*100%) auto;background-position:calc(var(--sx)/(1024 - var(--sw))*100%) calc(var(--sy)/(1024 - var(--sh))*100%);
 border-radius:22px;border:3px solid var(--gold2);background-origin:border-box;filter:drop-shadow(0 6px 10px rgba(60,0,10,.45))}
.m-wave{--sx:258;--sy:8;--sw:404;--sh:520}
.m-thanks{--sx:842;--sy:798;--sw:182;--sh:226}
.bubble{position:relative;background:#fff6dc;color:var(--ink);border:2px solid var(--gold2);border-radius:20px;padding:10px 16px;font-size:clamp(15px,3.8vmin,28px);font-weight:600;max-width:86vw;line-height:1.35}
.pill{background:linear-gradient(#f7dc86,#d9a937);color:#5a0714;font-weight:800;font-size:clamp(20px,5.2vmin,40px);padding:8px 26px;border-radius:999px;box-shadow:0 3px 0 #8a6414}
.qrcard{background:#fff;padding:10px;border-radius:18px;border:4px solid var(--gold);box-shadow:0 8px 22px rgba(40,0,8,.5)}
.qrcard svg{display:block;width:min(66vw,46vh);height:auto}
.bar{width:min(66vw,46vh);height:8px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .5s linear}
.bar.low i{background:#ff6a5c}
.row{display:flex;flex-direction:column;align-items:center;gap:10px}
.big{font-size:clamp(34px,10vmin,88px);font-weight:800;color:var(--gold);text-shadow:0 3px 0 #5a0714}
.tick{width:min(26vw,16vh);aspect-ratio:1;border-radius:50%;background:#1fa65a;border:5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:min(16vw,10vh);box-shadow:0 6px 16px rgba(0,0,0,.4)}
#aw{position:fixed;left:0;right:0;bottom:0;padding:10px;font-size:15px;background:#ffd24a;color:#4a0a14;font-weight:700;z-index:5;display:none}
#nv{position:fixed;width:2px;height:2px;opacity:.01;left:0;top:0;pointer-events:none}
#st{position:fixed;top:0;left:0;right:0;padding:6px;font-size:15px;background:#000;color:#ffd24a;display:none;z-index:5}
.paidbg{background:radial-gradient(120% 90% at 50% 18%,#2fae68 0%,#12703c 60%,#0a4a28 100%)!important}
@media (orientation:landscape) and (max-height:520px){#v{flex-direction:row;gap:24px}.mascot{--w:30vh!important}}
</style></head><body>
<video id="nv" muted playsinline loop></video><div id="aw">แตะหน้าจอ 1 ครั้ง เพื่อกันจอดับ (ให้รับ QR ได้ตลอด)</div><div id="st">⚠ ไม่ได้เชื่อมต่อ</div><div id="v"></div>
<script src="/qrcode.js"></script>
<script>
var v=document.getElementById('v'),st=document.getElementById('st'),timer=null,ws,wl,SHOP='อึ้งลักเส็ง',lastRx=Date.now(),retry=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shop(){return '<div class="shop">'+esc(SHOP)+'</div>'}
function mascot(cls,w){return '<div class="mascot '+cls+'" style="--w:'+w+'"></div>'}
function bg(p){document.documentElement.classList.toggle('paidbg',!!p);document.body.classList.toggle('paidbg',!!p)}
function render(m){clearInterval(timer);bg(false);if(m.shopName)SHOP=m.shopName;
 if(m.type==='show_qr'){var q=qrcode(0,'M');q.addData(m.payload);q.make();
  v.innerHTML=shop()+'<div class="qrcard">'+q.createSvgTag({cellSize:6,margin:2,scalable:true})+'</div><div class="amt">฿ '+esc(m.amount)+'</div><div class="bar" id="bar"><i id="fill"></i></div><div class="sub">สแกนจ่ายด้วยแอปธนาคาร · เหลือเวลา <b id="t"></b> วินาที</div>'+mascot('m-wave','min(34vw,22vh)');
  var total=(m.expiresInSec||180)*1000,end=Date.now()+total;
  var tick=function(){var left=Math.max(0,end-Date.now()),e=document.getElementById('t'),f=document.getElementById('fill'),b=document.getElementById('bar');
   if(e)e.textContent=Math.ceil(left/1000);if(f)f.style.width=(left/total*100)+'%';if(b)b.className='bar'+(left<30000?' low':'')};tick();timer=setInterval(tick,500)}
 else if(m.type==='paid'){bg(true);v.innerHTML='<div class="tick">✓</div><div class="big">รับเงินแล้ว</div><div class="amt">฿ '+esc(m.amount)+'</div><div class="row">'+mascot('m-thanks','min(40vw,24vh)')+'<div class="bubble">ขอบคุณที่มาอุดหนุนนะคะ</div></div>'+shop();beep();setTimeout(function(){render({type:'idle'})},5000)}
 else if(m.type==='expired'||m.type==='cancelled'){v.innerHTML=shop()+'<div class="big">'+(m.type==='expired'?'หมดเวลา':'ยกเลิกรายการ')+'</div><div class="sub">กรุณาแจ้งพนักงานเพื่อทำรายการใหม่</div>'+mascot('m-wave','min(44vw,28vh)');setTimeout(function(){render({type:'idle'})},4000)}
 else v.innerHTML=shop()+mascot('m-wave','min(66vw,44vh)')+'<div class="bubble">ยินดีต้อนรับสู่ร้านอึ้งลักเส็งนะคะ<br>ริสุซังยินดีให้บริการค่ะ</div><div class="pill">พร้อมรับชำระ</div>'}
function beep(){try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch(e){}}
function connect(){clearTimeout(retry);if(ws){ws.onopen=ws.onmessage=ws.onclose=ws.onerror=null;try{ws.close()}catch(e){}}
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');lastRx=Date.now();var me=ws;
 me.onopen=function(){lastRx=Date.now();st.style.display='none'};
 me.onmessage=function(e){lastRx=Date.now();st.style.display='none';try{var m=JSON.parse(e.data);if(m.type!=='ping')render(m)}catch(x){}};
 me.onclose=function(){st.style.display='block';retry=setTimeout(connect,3000)};me.onerror=function(){try{me.close()}catch(e){}}}
// สายเงียบเกิน 25 วิ (heartbeat มาทุก 10 วิ) = ถือว่าหลุด ต่อใหม่ทันที; ต่อใหม่ทุกครั้งที่ตื่น/กลับมาหน้านี้/เน็ตกลับมา
function check(){if(!ws||(ws.readyState!==1&&ws.readyState!==0)||Date.now()-lastRx>25000){st.style.display='block';connect()}}
setInterval(check,5000);document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
window.addEventListener('focus',check);window.addEventListener('online',check);window.addEventListener('pageshow',check);
// กันจอดับ 2 ชั้น: (1) Screen Wake Lock (ใช้ได้เฉพาะ https) (2) วิดีโอเล่นวนซ่อนไว้ — ใช้ได้บน http ธรรมดา ต้องแตะหน้าจอ 1 ครั้งหลังเปิดหน้า
var awOn=false,aw=document.getElementById('aw'),nv=document.getElementById('nv');
function nvStart(){if(awOn)return;try{var c=document.createElement('canvas');c.width=c.height=16;var x=c.getContext('2d'),n=0;setInterval(function(){x.fillStyle=(n++%2)?'#111':'#222';x.fillRect(0,0,16,16)},500);
 nv.srcObject=c.captureStream(2);var p=nv.play();if(p&&p.then)p.then(function(){awOn=true;aw.style.display='none'},function(){aw.style.display='block'});else{awOn=true;aw.style.display='none'}}catch(e){aw.style.display='block'}}
function wake(){try{navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})},function(){})}catch(e){}
 if(!awOn)nvStart();if(nv.paused&&awOn){try{nv.play()}catch(e){}}}
document.addEventListener('click',wake);document.addEventListener('touchstart',wake);document.addEventListener('visibilitychange',function(){if(!document.hidden)wake()});
setTimeout(function(){if(!awOn)aw.style.display='block'},1500);
render({type:'idle'});connect();wake();
</script></body></html>
