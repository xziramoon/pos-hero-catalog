   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const qty = q => Number.isInteger(+q) ? String(+q) : (+q).toFixed(3);
const lineAmt = it => it.amount ?? (+it.qty * +it.price);
const isLandscape = () => matchMedia('(orientation: landscape)').matches;
const U = n => `calc(${n} * var(--u))`;

const ICON_UP = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
const ICON_OK = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const sparkSvg = (x, y, s, d) => `<svg aria-hidden="true" class="fx a-spark" style="left:${x};top:${y};width:${U(s)};height:${U(s)};animation-delay:${d}s" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#f3cf6b"/></svg>`;
const heartSvg = (x, d, s) => `<svg aria-hidden="true" class="fx a-heart" style="left:${x};bottom:30%;width:${U(s)};height:${U(s)};animation-delay:${d}s" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#ff8fa3"/></svg>`;

function medal(size, inner, {coinClass = 'a-bob', small = false} = {}) {
  return `<div class="medal${small ? ' sm' : ''}" style="--s:${size}">
    <div class="coin ${coinClass}">${inner}</div>
    <div class="shadow" aria-hidden="true"></div></div>`;
}
const risuImg = (k, alt, cls = '') => `<img class="${cls}" src="${RISU[k]}" alt="${esc(alt)}">`;

function header(d, dark = false) {
  return `<header class="hd${dark ? ' dark' : ''}">
    <div class="logo" aria-hidden="true">黄</div>
    <div class="shop">${esc(d.shopName?.[0] ?? 'อึ้งลักเส็ง')} <b>${esc(d.shopName?.[1] ?? '')}</b></div>
    ${d.terminal ? `<div class="term">${esc(d.terminal)}</div>` : ''}</header>`;
}

   ========================================================= */
function welcome(d) {
  const poses = [['wave','ริสุซังโบกมือทักทาย'],['mega','ริสุซังถือโทรโข่ง'],['drink','ริสุซังถือเครื่องดื่ม'],['basket','ริสุซังถือตะกร้าสินค้า']];
  const imgs = poses.map(([k, a], i) => `<img class="a-cycle ${k === 'wave' ? 'wave' : ''}" style="animation-delay:${i * 3}s" src="${RISU[k]}" alt="${a}">`).join('');
  return `<section class="screen s-hero">
    ${d.terminal ? `<div class="term float">${esc(d.terminal)}</div>` : ''}
    <div class="stage">${medal(220, imgs)}
      ${sparkSvg('-6%','8%',22,0)}${sparkSvg('92%','2%',16,.7)}${sparkSvg('96%','58%',20,1.4)}${sparkSvg('-10%','64%',14,1.9)}</div>
    <div class="hero-txt">
      <div class="h">ยินดีต้อนรับค่ะ</div>
      <div class="s1">${esc((d.shopName || []).join(' '))}</div>
      <div class="s2">黄六盛</div>
    </div></section>`;
}

/* =========================================================
   หน้ารายการสินค้า (+ ยอดไม่ตรง)
   ========================================================= */
function itemRow(it, no) {
  return `<div class="row"><div class="no">${no}</div>
    <div class="mid"><div class="name">${esc(it.name)}</div>
    <div class="qp">${qty(it.qty)} ${esc(it.unit)} × ฿${money(it.price)}</div></div>
    <div class="amt">${money(lineAmt(it))}</div></div>`;
}
function items(d) {
  const list = d.items || [];
  const last = list[list.length - 1];
  const sum = list.reduce((s, it) => s + lineAmt(it), 0);
  const mismatch = d.mismatch ?? Math.abs(sum - d.total) > 0.005;
  const maxOlder = isLandscape() ? 3 : 4;
  const older = mismatch ? [] : list.slice(0, -1);
  const shown = older.slice(-maxOlder);
  const hidden = older.length - shown.length;
  const pieces = list.reduce((s, it) => s + (Number.isInteger(+it.qty) ? +it.qty : 1), 0);
  const count = mismatch ? 'ยอดจาก POS' : `${list.length} รายการ · ${pieces} ชิ้น`;
  const rows = shown.map((it, i) => itemRow(it, hidden + i + 1)).join('');
  return `<section class="screen s-items">
    ${header(d)}
    <main class="list">
      ${shown.length < 2 ? '<div class="wm" aria-hidden="true">黄六盛</div>' : ''}
      <div class="rows">
        ${hidden > 0 ? `<div class="chip">${ICON_UP}<span>ก่อนหน้าอีก ${hidden} รายการ</span></div>` : ''}
        ${rows}
      </div>
      ${mismatch ? '<div class="note">รายการทั้งหมดและส่วนลด แสดงในใบเสร็จ</div>' : ''}
    </main>
    <div class="latest-wrap">${last ? `
      <section class="latest" aria-label="รายการล่าสุด">
        <div class="peek" aria-hidden="true"><img class="a-pop" src="${RISU.basket}" alt=""></div>
        <span class="tag">เพิ่งยิง</span>
        <div class="name">${esc(last.name)}</div>
        <div class="bot"><div class="qp">${qty(last.qty)} ${esc(last.unit)} × ฿${money(last.price)}</div>
        <div class="amt">฿${money(lineAmt(last))}</div></div>
      </section>` : ''}</div>
    <footer class="tot">
      <div class="top"><div class="lbl">ยอดรวม</div><div class="cnt">${count}</div></div>
      <div class="money"><span class="c">฿</span><span class="v">${money(d.total)}</span></div>
    </footer></section>`;
}

/* =========================================================
   หน้าจ่ายเงิน
   ========================================================= */
function pay(d) {
  const p = d.pay || {};
  if (p.received == null) {
    return `<section class="screen s-pay">
      ${header(d)}
      <section class="due"><div class="lbl">ยอดที่ต้องชำระ</div>
        <div class="money"><span class="c">฿</span><span class="v">${money(p.due)}</span></div></section>
      <main class="pbody">
        <div class="slot"><div class="k">รับเงิน</div><div class="wait"><i aria-hidden="true"></i>รอรับเงิน</div></div>
        <div class="slot"><div class="k">เงินทอน</div><div class="dash">– – –</div></div>
        <div class="invite">${medal(isLandscape() ? 70 : 96, risuImg('mega', 'ริสุซังถือโทรโข่ง', 'a-shout'), {coinClass:'', small:true})}
          <div class="bubble">เชิญชำระเงิน<br>กับพนักงานได้เลยค่ะ</div></div>
      </main></section>`;
  }
  return `<section class="screen s-paid">
    ${header(d, true)}
    <div class="kv">
      <div class="r"><div class="k">ยอดที่ต้องชำระ</div><div class="v1">฿${money(p.due)}</div></div>
      <div class="r"><div class="k">รับเงิน</div><div class="v2">฿${money(p.received)}</div></div>
    </div>
    <div class="chg"><div class="lbl">เงินทอน</div>
      <div class="money"><span class="c">฿</span><span class="v">${money(p.change)}</span></div></div>
    <div class="ok">${ICON_OK}รับเงินเรียบร้อย</div></section>`;
}

/* =========================================================
   หน้าขอบคุณ (ค้าง 8 วินาที)
   ========================================================= */
function thanks(d) {
  const ch = +(d.thanks?.change || 0);
  return `<section class="screen s-hero">
    <div class="term float">${esc(d.terminal)}</div>
    <div class="stage">${medal(190, risuImg('thanks', 'ริสุซังไหว้ขอบคุณ', 'a-bow'))}
      ${heartSvg('2%',0,22)}${heartSvg('80%',.9,18)}${heartSvg('88%',1.8,24)}${heartSvg('-4%',2.2,16)}</div>
    <div class="hero-side">
      <div class="hero-txt"><div class="h">ขอบคุณค่ะ</div><div class="s1">แล้วพบกันใหม่นะคะ</div></div>
      ${ch > 0 ? `<div class="chgcard"><div class="k">เงินทอน</div><div class="v">฿${money(ch)}</div></div>` : ''}
      <div class="cd"><div class="bar"><i></i></div><div class="t">กลับหน้าแรกอัตโนมัติ</div></div>
    </div></section>`;
}

/* =========================================================
   render(data): วาดใหม่ทั้งหน้า
   ========================================================= */

const SCREENS = {welcome, items, pay, thanks};
let current = null;
function draw(data){ current = data; document.getElementById('app').innerHTML = (SCREENS[data.screen] || welcome)(data); }
function render(data){
  // หน้าต้อนรับ/ขอบคุณห้ามวาดซ้ำระหว่างแสดง ไม่งั้นแอนิเมชันเริ่มใหม่
  if (current && current.screen === data.screen && (data.screen === 'welcome' || (data.screen === 'thanks' && +current.thanks.change === +data.thanks.change))) return;
  draw(data);
}
matchMedia('(orientation: landscape)').addEventListener('change', () => current && draw(current));
return { render: render, reset: function(){ current = null; } };
})();
function showNew(d){document.body.classList.add('nw');d.shopName=shopParts();NEW.render(d)}
function showOld(){document.body.classList.remove('nw');NEW.reset()}
function shopParts(){var s=String(SHOP||'').trim(),i=s.indexOf(' ');if(s==='อึ้งลักเส็ง')return ['อึ้งลักเส็ง','ซุปเปอร์มาร์เก็ต'];return i<0?[s,'']:[s.slice(0,i),s.slice(i+1).trim()]}
var v=document.getElementById('v'),st=document.getElementById('st'),timer=null,ws,wl,SHOP='อึ้งลักเส็ง',lastRx=Date.now(),retry=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shop(){return '<div class="shop">'+esc(SHOP)+'</div>'}
function mascot(cls,w){return '<div class="mascot '+cls+'" style="--w:'+w+'"></div>'}
function bg(p){document.documentElement.classList.toggle('paidbg',!!p);document.body.classList.toggle('paidbg',!!p)}
function render(m){clearInterval(timer);bg(false);v.className='';if(m.shopName)SHOP=m.shopName;
 if(['show_qr','paid','expired','cancelled'].indexOf(m.type)>=0)showOld();
 if(m.type==='show_qr'){var q=qrcode(0,'M');q.addData(m.payload);q.make();
  v.innerHTML=shop()+'<div class="qrcard">'+q.createSvgTag({cellSize:6,margin:2,scalable:true})+'</div><div class="amt">฿ '+esc(m.amount)+'</div><div class="bar" id="bar"><i id="fill"></i></div><div class="sub">สแกนจ่ายด้วยแอปธนาคาร · เหลือเวลา <b id="t"></b> วินาที</div>'+mascot('m-wave','min(34vw,22vh)');
  var total=(m.expiresInSec||180)*1000,end=Date.now()+total;
  var tick=function(){var left=Math.max(0,end-Date.now()),e=document.getElementById('t'),f=document.getElementById('fill'),b=document.getElementById('bar');
   if(e)e.textContent=Math.ceil(left/1000);if(f)f.style.width=(left/total*100)+'%';if(b)b.className='bar'+(left<30000?' low':'')};tick();timer=setInterval(tick,500)}
 else if(m.type==='paid'){bg(true);v.innerHTML='<div class="tick">✓</div><div class="big">รับเงินแล้ว</div><div class="amt">฿ '+esc(m.amount)+'</div><div class="row">'+mascot('m-thanks','min(40vw,24vh)')+'<div class="bubble">ขอบคุณที่มาอุดหนุนนะคะ</div></div>'+shop();beep();setTimeout(function(){render({type:'idle'})},5000)}
 else if(m.type==='expired'||m.type==='cancelled'){v.innerHTML=shop()+'<div class="big">'+(m.type==='expired'?'หมดเวลา':'ยกเลิกรายการ')+'</div><div class="sub">กรุณาแจ้งพนักงานเพื่อทำรายการใหม่</div>'+mascot('m-wave','min(44vw,28vh)');setTimeout(function(){render({type:'idle'})},4000)}
 else if(m.type==='cart'){var L=(m.items||[]).slice(),k=L.findIndex(function(i){return i.id===m.last});
  if(k>=0)L.push(L.splice(k,1)[0]);if(m.fallback&&L.length)L=[L[L.length-1]];
  showNew({screen:'items',items:L,total:m.total,mismatch:!!m.fallback,terminal:m.machine||''})}
 else if(m.type==='pay'){var rc=(m.cash>0)?m.cash:null;showNew({screen:'pay',terminal:m.machine||'',pay:{due:m.due,received:rc,change:rc==null?null:(m.change||0)}})}
 else if(m.type==='thanks'){showNew({screen:'thanks',terminal:m.machine||'',thanks:{change:m.change||0}});timer=setTimeout(function(){render({type:'idle'})},9000)}
 else showNew({screen:'welcome',terminal:m.machine||''})}
function beep(){try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch(e){}}
function connect(){clearTimeout(retry);if(ws){ws.onopen=ws.onmessage=ws.onclose=ws.onerror=null;try{ws.close()}catch(e){}}
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');lastRx=Date.now();var me=ws;
 me.onopen=function(){lastRx=Date.now();st.style.display='none'};
 me.onmessage=function(e){lastRx=Date.now();st.style.display='none';try{var m=JSON.parse(e.data);if(m.type!=='ping')render(m)}catch(x){}};
 me.onclose=function(){st.style.display='block';retry=setTimeout(connect,3000)};me.onerror=function(){try{me.close()}catch(e){}}}
// สายเงียบเกิน 25 วิ (heartbeat มาทุก 10 วิ) = ถือว่าหลุด ต่อใหม่ทันที; ต่อใหม่ทุกครั้งที่ตื่น/กลับมาหน้านี้/เน็ตกลับมา
function check(){if(!ws||(ws.readyState!==1&&ws.readyState!==0)||Date.now()-lastRx>25000){st.style.display='block';connect()}}
setInterval(check,5000);document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
window.addEventListener('focus',check);window.addEventListener('online',check);window.addEventListener('pageshow',check);
// กันจอดับ 2 ชั้น: (1) Screen Wake Lock (ใช้ได้เฉพาะ https) (2) วิดีโอเล่นวนซ่อนไว้ — ใช้ได้บน http ธรรมดา ต้องแตะหน้าจอ 1 ครั้งหลังเปิดหน้า
var awOn=false,aw=document.getElementById('aw'),nv=document.getElementById('nv');
function nvStart(){if(awOn)return;try{var c=document.createElement('canvas');c.width=c.height=16;var x=c.getContext('2d'),n=0;setInterval(function(){x.fillStyle=(n++%2)?'#111':'#222';x.fillRect(0,0,16,16)},500);
 nv.srcObject=c.captureStream(2);var p=nv.play();if(p&&p.then)p.then(function(){awOn=true;aw.style.display='none'},function(){aw.style.display='block'});else{awOn=true;aw.style.display='none'}}catch(e){aw.style.display='block'}}
function wake(){try{navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})},function(){})}catch(e){}
 if(!awOn)nvStart();if(nv.paused&&awOn){try{nv.play()}catch(e){}}}
document.addEventListener('click',wake);document.addEventListener('touchstart',wake);document.addEventListener('visibilitychange',function(){if(!document.hidden)wake()});
setTimeout(function(){if(!awOn)aw.style.display='block'},1500);
render({type:'idle'});connect();wake();
</script></body></html>
