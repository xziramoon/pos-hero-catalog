<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>ตั้งค่า QR ล็อกยอด</title>
<style>
body{margin:0;padding:14px;font-family:system-ui,"Noto Sans Thai",sans-serif;background:#fff;color:#111}
label{display:block;margin:10px 0 3px;font-weight:600;font-size:14px} .h{font-weight:400;color:#666;font-size:12px}
input,select,textarea{width:100%;box-sizing:border-box;font-size:15px;padding:6px;border:1px solid #bbb;border-radius:5px}
textarea{height:80px;font-family:monospace;font-size:12px} .row{display:flex;gap:10px}.row>div{flex:1}
button{font-size:16px;padding:9px 16px;border:0;border-radius:6px;background:#0a7;color:#fff;margin-top:14px}
.ok{color:#080}.err{color:#c00} #pv svg{width:140px;height:140px} #pv{text-align:center}
</style></head><body>
<label><input type="checkbox" id="enabled" style="width:auto"> เปิดใช้ QR ล็อกยอด</label>
<div class="row"><div><label>ชื่อเครื่อง</label><input id="machineName"></div>
<div><label>ธนาคาร</label><select id="bank"><option value="maemanee">แม่มณี</option><option value="bbl">กรุงเทพ</option><option value="other">อื่นๆ</option></select></div></div>
<label>ข้อความ QR ต้นแบบ <span class="h">(สแกนป้าย QR ไม่ระบุยอดของร้านด้วยแอปอ่าน QR ธรรมดา แล้ววางข้อความที่ขึ้นต้นด้วย 0002)</span></label>
<textarea id="qrTemplate"></textarea><div id="tv"></div><div id="pv"></div>
<label>ชื่อร้าน (แสดงบนจอลูกค้า)</label><input id="shopName">
<div class="row"><div><label>อายุ QR (วินาที)</label><input id="expirySec" type="number" min="30"></div>
<div><label>เตือนเมื่อยอดเกิน (บาท)</label><input id="warnAmountOver" type="number" min="0"></div></div>
<div class="row"><div><label>ปุ่มลัด</label><input id="hotkey"></div>
<div><label>พอร์ตจอลูกค้า</label><input id="displayPort" type="number"></div></div>
<label>รหัสประเภทที่เป็นเงินโอน <span class="h">(คั่นด้วยจุลภาค เช่น 02)</span></label><input id="transferCodes">
<button id="save">บันทึก</button> <span id="m"></span>
<script src="vendor/qrcode.js"></script>
<script>
const $=id=>document.getElementById(id),F=['machineName','bank','qrTemplate','shopName','expirySec','warnAmountOver','hotkey','displayPort'];
async function check(){const t=$('qrTemplate').value.trim();$('pv').innerHTML='';if(!t){$('tv').textContent='';return}
 const r=await qrlockSet.validate(t);$('tv').className=r.ok?'ok':'err';
 if(r.ok){$('tv').textContent='ต้นแบบถูกต้อง ✓ (ตัวอย่าง QR ยอด 1 บาท ใช้สแกนทดสอบได้)';const q=qrcode(0,'M');q.addData(r.sample);q.make();$('pv').innerHTML=q.createSvgTag({cellSize:4,margin:4,scalable:true})}
 else $('tv').textContent='ต้นแบบใช้ไม่ได้: '+r.error}
qrlockSet.load().then(c=>{$('enabled').checked=!!c.enabled;F.forEach(k=>$(k).value=c[k]??'');$('transferCodes').value=(c.transferCodes||[]).join(',');check()});
$('qrTemplate').oninput=check;
$('save').onclick=async()=>{const c={enabled:$('enabled').checked,transferCodes:$('transferCodes').value.split(',').map(s=>s.trim()).filter(Boolean)};
 F.forEach(k=>c[k]=$(k).value);const r=await qrlockSet.save(c);$('m').className=r.ok?'ok':'err';$('m').textContent=r.ok?'บันทึกแล้ว ✓':r.error}
</script></body></html>
