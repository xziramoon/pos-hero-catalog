<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Catalog Hero — ช่องเก็บของ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&amp;family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0705}
a{color:#f6c453}a:hover{color:#ffe27a}
button{font-family:'Chakra Petch',sans-serif}
.slot:hover{filter:brightness(1.25)}
.pxbtn:hover{filter:brightness(1.15)}
input::placeholder{color:#8f7f60}
</style>
</helmet>

<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #120d09; background-image: radial-gradient(circle at 18% -10%, rgba(217,154,27,0.20), transparent 55%), radial-gradient(circle at 100% 110%, rgba(246,196,83,0.08), transparent 50%); font-family: 'Chakra Petch', sans-serif; color: #f1e9d2; overflow: hidden">

  <!-- ===== Title bar (frameless window) ===== -->
  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 16px; background: #1a130b; border-bottom: 2px solid #6b4a12; box-shadow: 0 2px 0 #000">
    <svg width="26" height="26" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="1" y="4" width="14" height="10" fill="#8a5a1c"></rect>
      <rect x="1" y="4" width="14" height="4" fill="#b4762a"></rect>
      <rect x="1" y="8" width="14" height="1" fill="#3a2410"></rect>
      <rect x="7" y="7" width="2" height="3" fill="#ffe27a"></rect>
      <rect x="1" y="3" width="14" height="1" fill="#f6c453"></rect>
      <rect x="1" y="14" width="14" height="1" fill="#3a2410"></rect>
    </svg>
    <div style="font-family: 'Press Start 2P', monospace; font-size: 13px; color: #ffe27a; letter-spacing: 1px; text-shadow: 2px 2px 0 #000">CATALOG HERO</div>
    <div style="font-size: 14px; color: #d3c3a0">ร้าน อึ้งลักเส็ง ซุปเปอร์มาร์เก็ต</div>
    <div style="flex: 1"></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: #102015; border: 2px solid #2f6b3a; font-size: 13px; color: #86efac">
      <span style="width: 8px; height: 8px; background: #4ade80; box-shadow: 0 0 6px #4ade80"></span>
      LAN ซิงก์แล้ว
    </div>
    <button class="pxbtn" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; background: #241a10; border: 2px solid #6b4a12; color: #f1e9d2; font-size: 13px; cursor: pointer">
      <svg width="14" height="14" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="4" height="1" fill="#f6c453"></rect><rect x="1" y="1" width="1" height="3" fill="#f6c453"></rect><rect x="6" y="1" width="1" height="3" fill="#f6c453"></rect><rect x="0" y="3" width="8" height="5" fill="#f6c453"></rect><rect x="3" y="5" width="2" height="2" fill="#241a10"></rect></svg>
      ล็อกการแก้ไข
    </button>
    <div style="display: flex; gap: 4px; margin-left: 4px">
      <button class="pxbtn" aria-label="ปักหมุดลอยบนสุด" style="width: 32px; height: 32px; background: #241a10; border: 2px solid #6b4a12; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="4" height="1" fill="#ffe27a"></rect><rect x="3" y="1" width="2" height="3" fill="#ffe27a"></rect><rect x="1" y="4" width="6" height="1" fill="#ffe27a"></rect><rect x="3" y="5" width="2" height="3" fill="#ffe27a"></rect></svg>
      </button>
      <button class="pxbtn" aria-label="ย่อหน้าต่าง" style="width: 32px; height: 32px; background: #241a10; border: 2px solid #6b4a12; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="12" height="12" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="6" width="6" height="2" fill="#d3c3a0"></rect></svg>
      </button>
      <button class="pxbtn" aria-label="ปิด" style="width: 32px; height: 32px; background: #3a1410; border: 2px solid #8a2a1e; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="12" height="12" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="2" height="2" fill="#fca5a5"></rect><rect x="2" y="2" width="1" height="1" fill="#fca5a5"></rect><rect x="3" y="3" width="2" height="2" fill="#fca5a5"></rect><rect x="5" y="5" width="1" height="1" fill="#fca5a5"></rect><rect x="6" y="6" width="2" height="2" fill="#fca5a5"></rect><rect x="6" y="0" width="2" height="2" fill="#fca5a5"></rect><rect x="5" y="2" width="1" height="1" fill="#fca5a5"></rect><rect x="2" y="5" width="1" height="1" fill="#fca5a5"></rect><rect x="0" y="6" width="2" height="2" fill="#fca5a5"></rect></svg>
      </button>
    </div>
  </div><div style="flex: 1; min-height: 0; display: flex; gap: 20px; padding: 18px 20px 20px">

    <!-- ===== Inventory (left) ===== -->
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">

      <!-- stash tabs -->
      <div style="display: flex; gap: 4px; padding-left: 6px; position: relative; z-index: 1">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
          <button onClick="{{t.pick}}" style="{{t.style}}">
            <sc-if value="{{t.isFav}}" hint-placeholder-val="{{ false }}">
              <svg width="11" height="11" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="0" width="1" height="1" fill="#f6c453"></rect><rect x="2" y="1" width="3" height="1" fill="#f6c453"></rect><rect x="0" y="2" width="7" height="1" fill="#f6c453"></rect><rect x="1" y="3" width="5" height="1" fill="#f6c453"></rect><rect x="2" y="4" width="3" height="1" fill="#f6c453"></rect><rect x="1" y="5" width="2" height="1" fill="#f6c453"></rect><rect x="4" y="5" width="2" height="1" fill="#f6c453"></rect><rect x="1" y="6" width="1" height="1" fill="#f6c453"></rect><rect x="5" y="6" width="1" height="1" fill="#f6c453"></rect></svg>
            </sc-if>
            <span>{{t.label}}</span>
            <span style="font-family: 'VT323', monospace; font-size: 17px; line-height: 1; color: #a08f6c">{{t.count}}</span>
          </button>
        </sc-for>
      </div>

      <!-- inventory panel -->
      <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; background: #241a10; border: 2px solid #6b4a12; box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #1a130b, 0 14px 34px rgba(0,0,0,0.55)">

        <!-- search + actions -->
        <div style="display: flex; gap: 10px; align-items: center">
          <div style="flex: 1; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; background: #140e08; border: 2px solid #6b4a12; box-shadow: inset 0 2px 0 #000">
            <svg width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="0" width="3" height="1" fill="#d3c3a0"></rect><rect x="0" y="1" width="1" height="3" fill="#d3c3a0"></rect><rect x="4" y="1" width="1" height="3" fill="#d3c3a0"></rect><rect x="1" y="4" width="3" height="1" fill="#d3c3a0"></rect><rect x="5" y="5" width="1" height="1" fill="#d3c3a0"></rect><rect x="6" y="6" width="2" height="2" fill="#d3c3a0"></rect></svg>
            <label for="catq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">ค้นหาชื่อหรือรหัสสินค้า</label>
            <input id="catq" value="{{q}}" onInput="{{onSearch}}" placeholder="ค้นหาชื่อ หรือยิงบาร์โค้ด…" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #f1e9d2; font-family: 'Chakra Petch', sans-serif; font-size: 15px">
            <span style="font-family: 'VT323', monospace; font-size: 16px; color: #a08f6c; border: 1px solid #3a2a14; padding: 0 6px">SCAN</span>
          </div>
          <button class="pxbtn" style="height: 44px; padding: 0 14px; background: #1a130b; border: 2px solid #6b4a12; color: #d3c3a0; font-size: 14px; cursor: pointer">เลือกหลายชิ้น</button>
          <button class="pxbtn" style="height: 44px; padding: 0 16px; background: #b45309; border: 2px solid #f6c453; box-shadow: inset 0 -3px 0 #7c3a06, 0 0 0 2px #000; color: #fff8e6; font-size: 14px; font-weight: 600; cursor: pointer">+ เพิ่มไอเทม</button>
        </div>

        <!-- slot grid -->
        <div style="{{gridStyle}}">
          <sc-for list="{{slots}}" as="item" hint-placeholder-count="60">
            <sc-if value="{{item.empty}}" hint-placeholder-val="{{ true }}">
              <div style="width: 72px; height: 72px; box-sizing: border-box; background: #140e08; border: 2px solid #2a1e10; box-shadow: inset 2px 2px 0 #0a0705"></div>
            </sc-if>
            <sc-if value="{{item.filled}}" hint-placeholder-val="{{ false }}">
              <button class="slot" onClick="{{item.pick}}" aria-label="{{item.name}}" style="{{item.slotStyle}}">
                <sc-if value="{{item.isFav}}" hint-placeholder-val="{{ false }}">
                  <svg style="position: absolute; top: 3px; right: 3px" width="11" height="11" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="0" width="1" height="1" fill="#ffe27a"></rect><rect x="2" y="1" width="3" height="1" fill="#ffe27a"></rect><rect x="0" y="2" width="7" height="1" fill="#ffe27a"></rect><rect x="1" y="3" width="5" height="1" fill="#ffe27a"></rect><rect x="2" y="4" width="3" height="1" fill="#ffe27a"></rect><rect x="1" y="5" width="2" height="1" fill="#ffe27a"></rect><rect x="4" y="5" width="2" height="1" fill="#ffe27a"></rect><rect x="1" y="6" width="1" height="1" fill="#ffe27a"></rect><rect x="5" y="6" width="1" height="1" fill="#ffe27a"></rect></svg>
                </sc-if>
                <sc-if value="{{item.isBottle}}" hint-placeholder-val="{{ false }}">
                  <svg width="{{iconSize}}" height="{{iconSize}}" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="7" y="1" width="2" height="2" fill="{{item.c2}}"></rect><rect x="7" y="3" width="2" height="3" fill="#c9a777"></rect><rect x="5" y="6" width="6" height="9" fill="{{item.c1}}"></rect><rect x="5" y="9" width="6" height="3" fill="#f1e9d2"></rect><rect x="5" y="10" width="6" height="1" fill="{{item.c2}}"></rect><rect x="6" y="7" width="1" height="7" fill="#ffffff" fill-opacity="0.25"></rect></svg>
                </sc-if>
                <sc-if value="{{item.isSack}}" hint-placeholder-val="{{ false }}">
                  <svg width="{{iconSize}}" height="{{iconSize}}" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="5" y="2" width="6" height="2" fill="{{item.c1}}"></rect><rect x="5" y="4" width="6" height="1" fill="#6b4a12"></rect><rect x="3" y="5" width="10" height="10" fill="{{item.c1}}"></rect><rect x="2" y="7" width="1" height="7" fill="{{item.c1}}"></rect><rect x="13" y="7" width="1" height="7" fill="{{item.c1}}"></rect><rect x="5" y="8" width="6" height="4" fill="{{item.c2}}"></rect><rect x="4" y="5" width="1" height="9" fill="#ffffff" fill-opacity="0.35"></rect><rect x="2" y="14" width="12" height="1" fill="#000000" fill-opacity="0.25"></rect></svg>
                </sc-if>
                <sc-if value="{{item.isCan}}" hint-placeholder-val="{{ false }}">
                  <svg width="{{iconSize}}" height="{{iconSize}}" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="3" width="8" height="1" fill="#d9d9d9"></rect><rect x="4" y="4" width="8" height="10" fill="{{item.c1}}"></rect><rect x="4" y="7" width="8" height="3" fill="{{item.c2}}"></rect><rect x="5" y="4" width="1" height="10" fill="#ffffff" fill-opacity="0.25"></rect><rect x="4" y="14" width="8" height="1" fill="#8a8a8a"></rect></svg>
                </sc-if>
                <sc-if value="{{item.isPack}}" hint-placeholder-val="{{ false }}">
                  <svg width="{{iconSize}}" height="{{iconSize}}" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="3" width="12" height="11" fill="{{item.c1}}"></rect><rect x="2" y="3" width="12" height="1" fill="#000000" fill-opacity="0.22"></rect><rect x="2" y="13" width="12" height="1" fill="#000000" fill-opacity="0.22"></rect><rect x="3" y="4" width="10" height="1" fill="#ffffff" fill-opacity="0.35"></rect><rect x="5" y="6" width="6" height="5" fill="{{item.c2}}"></rect></svg>
                </sc-if>
                <sc-if value="{{item.isBox}}" hint-placeholder-val="{{ false }}">
                  <svg width="{{iconSize}}" height="{{iconSize}}" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="3" width="10" height="11" fill="{{item.c1}}"></rect><rect x="3" y="3" width="10" height="2" fill="#ffffff" fill-opacity="0.3"></rect><rect x="5" y="7" width="6" height="4" fill="{{item.c2}}"></rect><rect x="3" y="14" width="10" height="1" fill="#000000" fill-opacity="0.3"></rect></svg>
                </sc-if>
                <sc-if value="{{showNames}}" hint-placeholder-val="{{ true }}">
                  <span style="display: block; width: 100%; padding: 0 3px; box-sizing: border-box; font-size: 10.5px; line-height: 1.2; color: #d3c3a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center">{{item.name}}</span>
                </sc-if>
              </button>
            </sc-if>
          </sc-for>
        </div>

        <!-- capacity + pages -->
        <div style="margin-top: auto; display: flex; align-items: center; gap: 14px">
          <div style="font-size: 13px; color: #d3c3a0">ช่องที่ใช้</div>
          <div style="width: 220px; height: 12px; background: #140e08; border: 2px solid #6b4a12; box-shadow: 0 0 0 1px #000">
            <div style="{{capStyle}}"></div>
          </div>
          <div style="font-family: 'VT323', monospace; font-size: 20px; color: #f1e9d2">{{used}} / {{capacity}}</div>
          <div style="flex: 1"></div>
          <button class="pxbtn" aria-label="หน้าก่อนหน้า" style="width: 32px; height: 32px; background: #1a130b; border: 2px solid #6b4a12; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="0" width="1" height="1" fill="#f6c453"></rect><rect x="2" y="1" width="1" height="1" fill="#f6c453"></rect><rect x="1" y="2" width="1" height="1" fill="#f6c453"></rect><rect x="2" y="3" width="1" height="1" fill="#f6c453"></rect><rect x="3" y="4" width="1" height="1" fill="#f6c453"></rect></svg>
          </button>
          <div style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ffe27a">PAGE 1/1</div>
          <button class="pxbtn" aria-label="หน้าถัดไป" style="width: 32px; height: 32px; background: #1a130b; border: 2px solid #6b4a12; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="0" width="1" height="1" fill="#f6c453"></rect><rect x="2" y="1" width="1" height="1" fill="#f6c453"></rect><rect x="3" y="2" width="1" height="1" fill="#f6c453"></rect><rect x="2" y="3" width="1" height="1" fill="#f6c453"></rect><rect x="1" y="4" width="1" height="1" fill="#f6c453"></rect></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ===== Item detail (right) ===== -->
    <div style="width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; padding-top: 36px">
      <div style="display: flex; flex-direction: column; background: #241a10; border: 2px solid #6b4a12; box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #1a130b, 0 14px 34px rgba(0,0,0,0.55)">
        <div style="{{rarityStyle}}">
          <span>{{rarityLabel}}</span>
          <span style="font-family: 'Press Start 2P', monospace; font-size: 8px; opacity: 0.85">ITEM</span>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 20px 18px">
          <div style="{{bigFrameStyle}}">
            <sc-if value="{{sel.isBottle}}" hint-placeholder-val="{{ true }}">
              <svg width="120" height="120" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="7" y="1" width="2" height="2" fill="{{sel.c2}}"></rect><rect x="7" y="3" width="2" height="3" fill="#c9a777"></rect><rect x="5" y="6" width="6" height="9" fill="{{sel.c1}}"></rect><rect x="5" y="9" width="6" height="3" fill="#f1e9d2"></rect><rect x="5" y="10" width="6" height="1" fill="{{sel.c2}}"></rect><rect x="6" y="7" width="1" height="7" fill="#ffffff" fill-opacity="0.25"></rect></svg>
            </sc-if>
            <sc-if value="{{sel.isSack}}" hint-placeholder-val="{{ false }}">
              <svg width="120" height="120" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="5" y="2" width="6" height="2" fill="{{sel.c1}}"></rect><rect x="5" y="4" width="6" height="1" fill="#6b4a12"></rect><rect x="3" y="5" width="10" height="10" fill="{{sel.c1}}"></rect><rect x="2" y="7" width="1" height="7" fill="{{sel.c1}}"></rect><rect x="13" y="7" width="1" height="7" fill="{{sel.c1}}"></rect><rect x="5" y="8" width="6" height="4" fill="{{sel.c2}}"></rect><rect x="4" y="5" width="1" height="9" fill="#ffffff" fill-opacity="0.35"></rect><rect x="2" y="14" width="12" height="1" fill="#000000" fill-opacity="0.25"></rect></svg>
            </sc-if>
            <sc-if value="{{sel.isCan}}" hint-placeholder-val="{{ false }}">
              <svg width="120" height="120" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="3" width="8" height="1" fill="#d9d9d9"></rect><rect x="4" y="4" width="8" height="10" fill="{{sel.c1}}"></rect><rect x="4" y="7" width="8" height="3" fill="{{sel.c2}}"></rect><rect x="5" y="4" width="1" height="10" fill="#ffffff" fill-opacity="0.25"></rect><rect x="4" y="14" width="8" height="1" fill="#8a8a8a"></rect></svg>
            </sc-if>
            <sc-if value="{{sel.isPack}}" hint-placeholder-val="{{ false }}">
              <svg width="120" height="120" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="3" width="12" height="11" fill="{{sel.c1}}"></rect><rect x="2" y="3" width="12" height="1" fill="#000000" fill-opacity="0.22"></rect><rect x="2" y="13" width="12" height="1" fill="#000000" fill-opacity="0.22"></rect><rect x="3" y="4" width="10" height="1" fill="#ffffff" fill-opacity="0.35"></rect><rect x="5" y="6" width="6" height="5" fill="{{sel.c2}}"></rect></svg>
            </sc-if>
            <sc-if value="{{sel.isBox}}" hint-placeholder-val="{{ false }}">
              <svg width="120" height="120" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="3" width="10" height="11" fill="{{sel.c1}}"></rect><rect x="3" y="3" width="10" height="2" fill="#ffffff" fill-opacity="0.3"></rect><rect x="5" y="7" width="6" height="4" fill="{{sel.c2}}"></rect><rect x="3" y="14" width="10" height="1" fill="#000000" fill-opacity="0.3"></rect></svg>
            </sc-if>
          </div>

          <div style="font-size: 22px; font-weight: 600; text-align: center; color: #f1e9d2; line-height: 1.3">{{sel.name}}</div>
          <div style="display: flex; align-items: center; gap: 6px; padding: 3px 10px; background: #1a130b; border: 1px solid #6b4a12; font-size: 13px; color: #d3c3a0">หมวด · {{sel.cat}}</div>
        </div>

        <div style="margin: 0 16px; border-top: 2px dashed #3a2a14"></div>

        <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 20px 16px">
          <div style="font-size: 12px; color: #a08f6c">รหัสสินค้า / บาร์โค้ด</div>
          <div style="display: flex; align-items: center; gap: 10px">
            <div style="flex: 1; font-family: 'VT323', monospace; font-size: 30px; line-height: 1; color: #ffe27a; letter-spacing: 1px">{{sel.code}}</div>
            <button class="pxbtn" onClick="{{copy}}" style="height: 36px; padding: 0 12px; background: #1a130b; border: 2px solid #6b4a12; color: #f1e9d2; font-size: 13px; cursor: pointer">คัดลอก</button>
          </div>
          <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
            <div style="font-size: 13px; color: #86efac">✓ คัดลอกรหัสแล้ว</div>
          </sc-if>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 16px 16px">
          <button class="pxbtn" style="height: 44px; background: #b45309; border: 2px solid #f6c453; box-shadow: inset 0 -3px 0 #7c3a06; color: #fff8e6; font-size: 14px; font-weight: 600; cursor: pointer">แก้ไข</button>
          <button class="pxbtn" style="height: 44px; background: #1a130b; border: 2px solid #6b4a12; color: #f1e9d2; font-size: 14px; cursor: pointer">ย้ายหมวด</button>
          <button class="pxbtn" onClick="{{toggleFav}}" style="{{favBtnStyle}}">{{favBtnLabel}}</button>
        </div>
      </div>

      <!-- legend -->
